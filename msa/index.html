<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA Visualizations</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/molstar@latest/build/viewer/molstar.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>MSA Visualizations</h1>
        </header>
        <main>
            <div id="file-loader">
                <h2>MSA Sequence Visualization</h2>
                <p>Loading lamprey.a3m...</p>
            </div>
            <div id="controls">
                <button id="next-btn">Next</button>
                <button id="matrix-btn">Show Matrix</button>
                <div id="matrix-spinner" class="spinner" style="display: none;"></div>
            </div>
            <div id="visualization">
                <svg id="sequence-viz"></svg>
            </div>
            <div id="matrix-visualization" style="display: none;">
                <h2>Difference Matrix</h2>
                <div class="matrix-container">
                    <div class="matrix-left">
                        <svg id="matrix-svg"></svg>
                        <div id="matrix-position" class="matrix-position"></div>
                    </div>
                    <div class="matrix-right">
                        <div id="molstar-viewer"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
