<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA Visualization</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/pdbe-molstar@latest/build/pdbe-molstar-plugin.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pdbe-molstar@latest/build/pdbe-molstar-plugin.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <select id="protein-selector">
                <!-- Options will be populated by JavaScript -->
            </select>
        </header>
        <main>
            <div id="tabs">
                <button id="mutation-tab" class="tab-button active">Mutation</button>
                <button id="alignment-tab" class="tab-button">Alignment</button>
            </div>

            <div id="alignment-content" class="tab-content" style="display: none;">
                <div id="file-loader">
                    <p>Loading lamprey.a3m...</p>
                </div>
                <div id="controls">
                    <button id="previous-btn">Previous</button>
                    <button id="next-btn">Next</button>
                    <button id="random-btn">Random</button>
                </div>
                <div id="visualization">
                    <svg id="sequence-viz"></svg>
                </div>
                <div id="alignment-quality-container" style="display: none;">
                    <h3>Alignment Quality</h3>
                    <svg id="alignment-quality-plot"></svg>
                </div>
            </div>

            <div id="mutation-content" class="tab-content active">
                <div id="controls-mutation">
                    <div id="matrix-spinner" class="spinner" style="display: none;"></div>
                </div>
                <div id="matrix-visualization" style="display: none;">
                    <h2 id="matrix-heading">Mutation Matrix</h2>
                    <div id="matrix-view-toggle" style="display: none; margin-bottom: 1rem;">
                        <button id="view-mutation-btn" class="view-toggle-btn active">Mutation Matrix</button>
                        <button id="view-distogram-btn" class="view-toggle-btn">Distogram</button>
                    </div>
                    <div class="matrix-container">
                        <div class="matrix-left">
                            <svg id="matrix-svg"></svg>
                            <svg id="diff-count-svg"></svg>
                            <div id="matrix-position" class="matrix-position"></div>
                            <div class="matrix-help">
                                <small>Hold <kbd>Shift</kbd> to fix column | Hold <kbd>Ctrl</kbd> to fix row</small>
                            </div>
                        </div>
                        <div class="matrix-right">
                            <div id="molstar-viewer"></div>
                        </div>
                    </div>
                    <div id="matrix-values-plot-container" style="display: none;">
                        <h3>Matrix Values Distribution</h3>
                        <svg id="matrix-values-plot"></svg>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
