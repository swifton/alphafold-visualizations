<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSA Visualizations</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" type="text/css" href="https://www.ebi.ac.uk/pdbe/pdb-component-library/css/pdbe-molstar-3.1.0.css">
    <script type="text/javascript" src="https://www.ebi.ac.uk/pdbe/pdb-component-library/js/pdbe-molstar-plugin-3.1.0.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <select id="protein-selector">
                <!-- Options will be populated by JavaScript -->
            </select>
            <h1>MSA Visualizations</h1>
        </header>
        <main>
            <div id="tabs">
                <button id="alignment-tab" class="tab-button active">Alignment</button>
                <button id="correlation-tab" class="tab-button">Correlation</button>
            </div>

            <div id="alignment-content" class="tab-content active">
                <div id="file-loader">
                    <p>Loading lamprey.a3m...</p>
                </div>
                <div id="controls">
                    <button id="previous-btn">Previous</button>
                    <button id="next-btn">Next</button>
                    <button id="random-btn">Random</button>
                </div>
                <div id="visualization">
                    <svg id="sequence-viz"></svg>
                </div>
                <div id="alignment-quality-container" style="display: none;">
                    <h3>Alignment Quality</h3>
                    <svg id="alignment-quality-plot"></svg>
                </div>
            </div>

            <div id="correlation-content" class="tab-content" style="display: none;">
                <div id="controls-correlation">
                    <div id="matrix-spinner" class="spinner" style="display: none;"></div>
                </div>
                <div id="matrix-visualization" style="display: none;">
                    <h2>Mutation Matrix</h2>
                    <div class="matrix-container">
                        <div class="matrix-left">
                            <svg id="matrix-svg"></svg>
                            <svg id="diff-count-svg"></svg>
                            <div id="matrix-position" class="matrix-position"></div>
                        </div>
                        <div class="matrix-right">
                            <div id="molstar-viewer"></div>
                            <div id="residue-controls" style="display: none;">
                                <button id="positive-btn">Highlight Positive</button>
                                <button id="negative-btn">Highlight Negative</button>
                                <button id="clear-highlight-btn">Clear Highlight</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
