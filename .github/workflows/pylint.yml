name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        pip install -r msa/requirements.txt
    - name: Analysing the code with pylint
      # --fail-on=E: any error-category finding fails the build outright.
      # --fail-under: the score floor, currently the score of a clean tree.
      #   Raise it as findings are fixed so the score can only ratchet up.
      #   Checks that are disabled outright live in .pylintrc.
      run: |
        pylint --fail-on=E --fail-under=9.4 $(git ls-files '*.py')
